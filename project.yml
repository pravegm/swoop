# XcodeGen spec. Generate the Xcode project on a Mac with:
#   brew install xcodegen && xcodegen generate
name: Swoop
options:
  bundleIdPrefix: com.pravegm
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""   # set in Xcode > Signing & Capabilities, or by testflight.yml
targets:
  Swoop:
    type: application
    platform: iOS
    sources:
      - path: Swoop
    info:
      path: Swoop/Info.plist
      properties:
        CFBundleDisplayName: Swoop
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Play is landscape (the Duo held like a book). All four orientations are listed so a Duo held in tabletop
        # (portrait inner canvas) is never letterboxed (Brim run 40203342285); portrait shows the pose card.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UIStatusBarHidden: true
        UIRequiresFullScreen: true
        UIUserInterfaceStyle: Dark
        UIViewControllerBasedStatusBarAppearance: false
        CADisableMinimumFrameDurationOnPhone: true
        ITSAppUsesNonExemptEncryption: false
        GKGameCenterBadgingDisabled: true
    entitlements:
      path: Swoop/Swoop.entitlements
      properties:
        com.apple.developer.game-center: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pravegm.swoop
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
  SwoopTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SwoopTests
    dependencies:
      - target: Swoop
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Swoop:
    build:
      targets:
        Swoop: all
        SwoopTests: [test]
    test:
      targets:
        - SwoopTests
